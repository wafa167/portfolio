/* Available colors */

const colors = [

    "#8fb6ab",  // green
    "#B3F9FF",  // cyan
    "#354c7c",  // blue
    "#cdb5ff",  // purple
    "	#eea1cd",  // pink
    "#ffe9a3",  // orange
    "#ffffff"   // white

];


columns.forEach(column => {

    /* Generate lots of code */

    for (let i = 0; i < 45; i++) {

        const piece =
            document.createElement("span");


        piece.classList.add("code-piece");


        /* Random code */

        piece.textContent =
            code[
                Math.floor(
                    Math.random() * code.length
                )
            ];


        /*
         * 30% chance of color
         * 70% stays gray
         */

        if (Math.random() < 0.30) {

            piece.classList.add("colored");


            const color =
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ];


            piece.style.color = color;

        }


        column.appendChild(piece);

    }

});
